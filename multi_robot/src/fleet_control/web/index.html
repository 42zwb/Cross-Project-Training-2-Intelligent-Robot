<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TurtleBot 协同实验室</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101823;color:#edf2f7;font:15px system-ui,sans-serif}header{padding:22px 30px;border-bottom:1px solid #304052;display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:0}small{color:#a4b2c4}main{display:grid;grid-template-columns:minmax(480px,1fr) 350px;gap:20px;padding:20px;max-width:1500px;margin:auto}.scene{background:#192535;border:1px solid #344358;border-radius:12px;overflow:hidden}canvas{width:100%;display:block;aspect-ratio:1}aside{display:flex;flex-direction:column;gap:14px}section{padding:17px;border:1px solid #344358;border-radius:12px;background:#192535}h2{font-size:16px;margin:0 0 12px}button{background:#2d425b;border:1px solid #48617e;color:white;border-radius:7px;padding:10px;cursor:pointer}button:hover{filter:brightness(1.2)}.primary{background:#087d72}.danger{background:#b82f41;width:100%;font-size:18px;font-weight:bold}.row{display:flex;gap:8px;margin:8px 0}.row>*{flex:1}input,select{min-width:0;width:100%;background:#0d1826;color:white;border:1px solid #48617e;border-radius:5px;padding:8px}label{font-size:12px;color:#b4c1d0}#message{white-space:pre-wrap;color:#a8dbd2;line-height:1.6}.legend{display:flex;gap:20px;padding:15px;flex-wrap:wrap}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}#robots{line-height:1.7;font-size:13px}.regions{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:7px}details{margin-top:12px}summary{cursor:pointer;color:#b4c1d0}.note{font-size:12px;line-height:1.7;color:#a4b2c4}@media(max-width:900px){main{grid-template-columns:1fr;padding:10px}header{padding:15px}.scene{min-width:0}}</style>
<header><div><h1>TurtleBot 协同实验室</h1><small>三机器人 · 激光建图 · 区域探索 · 队形切换</small></div><div id="mode">连接中…</div></header>
<img id="maptexture" src="/api/map.png" hidden><main><div class="scene"><canvas id="map" width="960" height="960"></canvas><div class="legend"><span><i class="dot" style="background:#56bbff"></i>robot1</span><span><i class="dot" style="background:#ffc16f"></i>robot2</span><span><i class="dot" style="background:#b49cff"></i>robot3</span><small>浅色：已观测空闲 · 深色：障碍 · 灰蓝：未知</small></div></div><aside>
<section><h2>任务状态</h2><div id="message"></div><p id="known"></p><div id="robots"></div></section>
<section><h2>协同建图</h2><div class="row"><button class="primary" onclick="command('explore')">开始 / 恢复探索</button><button onclick="command('pause')">暂停停车</button></div><button onclick="command('save')" style="width:100%">保存地图与运行结果</button><details><summary>开始前调整分区（m）</summary><p class="note">每行 xmin、ymin、xmax、ymax。三个矩形须覆盖场地、不重叠且包含各自起点。首次开始后锁定。</p><div id="regions"></div><button onclick="regions()">应用区域</button></details></section>
<section><h2>集合与队形</h2><select id="shape"><option value="triangle">等边三角形</option><option value="row">横排（局部 Y 轴）</option><option value="column">纵队（局部 X 轴）</option></select><div class="row"><label>中心 X (m)<input id="x" type="number" step="0.1" value="0"></label><label>中心 Y (m)<input id="y" type="number" step="0.1" value="0"></label></div><div class="row"><label>朝向 (rad)<input id="yaw" type="number" step="0.1" value="0"></label><label>间距 (m)<input id="spacing" type="number" min="0.7" max="3" step="0.1" value="1.2"></label></div><button class="primary" style="width:100%" onclick="formation()">切换至指定队形</button><div id="errors" class="note"></div></section>
<section><button class="danger" onclick="command('estop')">急停 · 锁定停车</button><div class="row"><button onclick="command('clear-estop')">解除急停，回到待命</button></div><p class="note">解除后需要重新发出任务。关闭网页不影响后台；在启动终端按 Ctrl+C 关闭系统。</p><p id="response" aria-live="polite"></p></section>
</aside></main>
<script>const colors=['#56bbff','#ffc16f','#b49cff'],canvas=document.getElementById('map'),ctx=canvas.getContext('2d');let state={},image=document.getElementById("maptexture"),version=-1,initialized=false;const $=id=>document.getElementById(id);const labels={BOOTSTRAP:'正在启动',IDLE:'待命',SWITCHING:'切换任务',EXPLORING:'协同探索',EXPLORED:'探索完成',RETURNING:'返回分区',FORMING:'队形调整',FORMATION_READY:'队形就绪',ESTOP:'急停锁定',FAULT:'故障停车'};
async function send(kind,data){try{const r=await fetch('/api/'+kind,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const a=await r.json();$('response').textContent=(a.success?'✓ ':'⚠ ')+a.message;$('response').style.color=a.success?'#91e5c6':'#ff9aa8'}catch(e){$('response').textContent='连接失败：'+e.message}}
function command(command){send('command',{command})}function formation(){send('formation',{shape:$('shape').value,...Object.fromEntries(['x','y','yaw','spacing'].map(k=>[k,Number($(k).value)]))})}function regions(){send('regions',{regions:[...$('regions').children].map(row=>[...row.children].map(e=>Number(e.value)))})}
function point(p){return[(p[0]+6)*80,(6-p[1])*80]}function draw(){ctx.fillStyle='#445160';ctx.fillRect(0,0,960,960);if(image.complete&&image.naturalWidth)ctx.drawImage(image,0,0,960,960);ctx.strokeStyle='#778a9e33';ctx.lineWidth=1;for(let i=0;i<=12;i++){ctx.beginPath();ctx.moveTo(i*80,0);ctx.lineTo(i*80,960);ctx.moveTo(0,i*80);ctx.lineTo(960,i*80);ctx.stroke()}(state.regions||[]).forEach((r,i)=>{const a=point([r[0],r[3]]),b=point([r[2],r[1]]);ctx.strokeStyle=colors[i]+'99';ctx.lineWidth=3;ctx.setLineDash([10,10]);ctx.strokeRect(a[0],a[1],b[0]-a[0],b[1]-a[1]);ctx.setLineDash([])});Object.entries(state.robots||{}).forEach(([name,r],i)=>{ctx.strokeStyle=colors[i];ctx.lineWidth=2;ctx.beginPath();(r.trail||[]).forEach((p,j)=>{const q=point(p);j?ctx.lineTo(...q):ctx.moveTo(...q)});ctx.stroke();if(r.goal){const p=point(r.goal);ctx.strokeRect(p[0]-6,p[1]-6,12,12)}if(r.pose){const p=point(r.pose);ctx.save();ctx.translate(...p);ctx.rotate(-r.pose[2]);ctx.fillStyle=colors[i];ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#102030';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(22,0);ctx.stroke();ctx.restore();ctx.fillStyle='#172433';ctx.font='bold 16px sans-serif';ctx.fillText(name,p[0]+18,p[1]-18)}});(state.formation_slots||[]).forEach(p=>{const q=point(p);ctx.strokeStyle='#00a78e';ctx.lineWidth=3;ctx.beginPath();ctx.arc(...q,13,0,Math.PI*2);ctx.stroke()});ctx.font='14px sans-serif';ctx.fillStyle='#2b4660';ctx.fillText('↑ +Y   → +X    每格 1 m',20,940)}
async function poll(){try{state=await(await fetch('/api/state')).json();$('mode').textContent=labels[state.mode]||state.mode;$('message').textContent=state.message;$('known').textContent='已观测栅格比例：'+((state.known_fraction||0)*100).toFixed(1)+'%（非真值覆盖率）';$('robots').textContent=Object.entries(state.robots||{}).map(([n,r])=>n+' 探索里程 '+r.travel.toFixed(2)+' m · '+(r.safety.reason||'运行中')).join('\n');$('robots').style.whiteSpace='pre-line';$('errors').textContent=Object.entries(state.formation_errors||{}).map(([n,e])=>n+': '+e.position.toFixed(3)+' m / '+(e.yaw*180/Math.PI).toFixed(1)+'°').join(' | ');if(!initialized&&state.regions){$('regions').replaceChildren(...state.regions.map(r=>{const d=document.createElement('div');d.className='regions';r.forEach(v=>{const e=document.createElement('input');e.type='number';e.step='.1';e.value=v;d.append(e)});return d}));initialized=true}if(state.map_version!==version){version=state.map_version;const img=new Image();img.onload=()=>{image=img;draw()};img.src='/api/map.png?v='+version}draw()}catch(e){$('mode').textContent='连接中断';$('message').textContent='请检查启动终端和运行日志。'}setTimeout(poll,500)}poll();</script></html>
